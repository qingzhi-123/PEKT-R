[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pektr"
version = "0.1.0"
description = "PEKT-R: programming error-aware knowledge tracing recommendation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.scripts]
pektr-preprocess-bepkt = "pektr.preprocess_bepkt:main"
pektr-train = "pektr.train:main"
pektr-recommend = "pektr.recommend:main"
pektr-evaluate = "pektr.evaluate:main"
pektr-tune = "pektr.tune:main"
pektr-score-search = "pektr.score_search:main"

[tool.setuptools.packages.find]
where = ["src"]
